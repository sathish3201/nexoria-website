services:
  - type: web
    name: nexoria-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_NOTIFY_EMAIL
        sync: false
      - key: CONTACT_FROM_EMAIL
        sync: false

  - type: web
    name: nexoria-storefront-backend
    runtime: node
    plan: free
    rootDir: demos/storefront/backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ADMIN_TOKEN
        sync: false

  - type: web
    name: nexoria-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://nexoria-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: nexoria-storefront-frontend
    runtime: static
    rootDir: demos/storefront/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://nexoria-storefront-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
